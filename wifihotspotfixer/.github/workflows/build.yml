# SETUP — WiFi Hotspot Fixer (APK Android)
# Build: GitHub Actions (tanpa install apapun di PC lo)
# Catatan: pakai Gradle langsung (tanpa wrapper) biar gak butuh gradlew di repo.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiHotspotFixer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
